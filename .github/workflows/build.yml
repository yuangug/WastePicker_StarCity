name: Build Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 清理 Fabric Loom 缓存
        run: rm -rf ~/.gradle/caches/fabric-loom ~/.gradle/caches/modules-2/files-2.1.net.fabricmc

      - name: 构建
        run: ./gradlew build --no-daemon --stacktrace
        working-directory: modproject

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: modproject/build/libs/*.jar
