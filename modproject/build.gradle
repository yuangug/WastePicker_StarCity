buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'fabric-loom'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archive_base_name
}

repositories {
    mavenCentral()
}

// MaLiLib: 在依赖解析前下载，确保 Loom 配置阶段能找到 jar
def malilibFile = file("libs/malilib-fabric-1.21.11-0.27.16.jar")
def malilibUrl = "https://cdn.modrinth.com/data/GcWjdA9I/versions/oaU4Ys3J/malilib-fabric-1.21.11-0.27.16.jar"
def malilibSha1 = "fc6930259e301a878f35576ecf55a770be0b4089"

if (!malilibFile.exists()) {
    malilibFile.parentFile.mkdirs()
    println "Downloading MaLiLib..."
    new URL(malilibUrl).withInputStream { input ->
        malilibFile.withOutputStream { output -> output << input }
    }
}

// 校验 SHA-1
def digest = java.security.MessageDigest.getInstance("SHA-1")
malilibFile.withInputStream { input ->
    byte[] buffer = new byte[8192]
    int read
    while ((read = input.read(buffer)) >= 0) {
        if (read > 0) digest.update(buffer, 0, read)
    }
}
def digestSha1 = digest.digest().collect { String.format("%02x", it & 0xff) }.join()
if (digestSha1 != malilibSha1) {
    throw new GradleException("MaLiLib SHA-1 mismatch: expected ${malilibSha1}, got ${digestSha1}")
}

loom {
    accessWidenerPath = file("src/main/resources/trashcandetector.accesswidener")

    // 标准 split 源码集：src/client/java 仅客户端可见，
    // Loom 会自动为其配置 Mixin 注解处理器与 refmap（生产环境必需）
    splitEnvironmentSourceSets()

    mods {
        "trashcandetector" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly files(malilibFile)
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archive_base_name}" }
    }
}
